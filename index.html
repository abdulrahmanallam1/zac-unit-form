<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZAC Unit Information Form</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #ededed;
  color: #111;
  font-family: Arial, Helvetica, sans-serif;
}

.page {
  width: 100%;
  max-width: 620px;
  min-height: 100vh;
  margin: auto;
  background: #fff;
}

.header {
  background: #050505;
  color: #fff;
  padding: 16px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.brand {
  font-size: 16px;
  font-weight: bold;
  letter-spacing: .3px;
}

.brand-small {
  margin-top: 4px;
  color: #aaa;
  font-size: 11px;
}

.language-buttons {
  display: flex;
  gap: 4px;
  direction: ltr;
}

.language-buttons button {
  border: 1px solid #777;
  background: #111;
  color: #fff;
  padding: 7px 10px;
  font-size: 12px;
  cursor: pointer;
}

.language-buttons button.active {
  background: #fff;
  color: #000;
}

.content {
  padding: 24px 20px 30px;
}

.eyebrow {
  color: #777;
  font-size: 12px;
  letter-spacing: .6px;
}

h1 {
  margin: 8px 0;
  font-size: 27px;
  line-height: 1.3;
}

.intro {
  margin: 0 0 22px;
  color: #555;
  font-size: 13px;
  line-height: 1.7;
}

.form-group {
  margin-top: 17px;
}

.form-label {
  display: block;
  margin-bottom: 7px;
  font-size: 13px;
  font-weight: bold;
}

input,
select,
textarea {
  width: 100%;
  border: 1px solid #222;
  border-radius: 0;
  background: #fff;
  color: #111;
  padding: 12px;
  font-family: inherit;
  font-size: 14px;
  outline: none;
}

input:focus,
select:focus,
textarea:focus {
  border-width: 2px;
}

textarea {
  min-height: 85px;
  resize: vertical;
}

.unit-types {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
}

.choice {
  position: relative;
  display: block;
  margin: 0;
  padding: 13px 6px;
  border: 1px solid #222;
  text-align: center;
  font-size: 13px;
  font-weight: normal;
  cursor: pointer;
}

.choice input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

.choice.selected {
  background: #000;
  color: #fff;
}

.other-input {
  display: none;
  margin-top: 8px;
}

.other-input.visible {
  display: block;
}

.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
  margin-top: 25px;
}

.send-button {
  border: 1px solid #111;
  background: #000;
  color: #fff;
  padding: 14px 8px;
  font-family: inherit;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
}

.send-button.email {
  background: #fff;
  color: #000;
}

#status {
  min-height: 20px;
  margin-top: 13px;
  text-align: center;
  color: #555;
  font-size: 12px;
}

.note {
  margin-top: 18px;
  color: #777;
  font-size: 11px;
  line-height: 1.7;
}

@media (max-width: 480px) {
  .content {
    padding: 20px 15px 28px;
  }

  h1 {
    font-size: 23px;
  }

  .unit-types {
    grid-template-columns: 1fr;
  }

  .buttons {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="page">

  <header class="header">
    <div>
      <div class="brand">ZAC Architecture Studio</div>
      <div class="brand-small">Unit Information Form</div>
    </div>

    <div class="language-buttons">
      <button id="arButton" class="active" type="button">
        عربي
      </button>

      <button id="enButton" type="button">
        EN
      </button>
    </div>
  </header>

  <main class="content">

    <div class="eyebrow" id="eyebrow">
      بيانات الوحدة
    </div>

    <h1 id="title">
      فورم معلومات الوحدة
    </h1>

    <p class="intro" id="intro">
      من فضلك املأ البيانات التالية وسنتواصل معك في أقرب وقت ممكن.
    </p>

    <form id="unitForm" novalidate>

      <div class="form-group">
        <label class="form-label" id="nameLabel" for="name">
          الاسم بالكامل
        </label>

        <input
          id="name"
          name="name"
          type="text"
          required
          placeholder="اكتب الاسم بالكامل">
      </div>

      <div class="form-group">
        <label class="form-label" id="phoneLabel" for="phone">
          رقم الهاتف
        </label>

        <input
          id="phone"
          name="phone"
          type="tel"
          required
          placeholder="01xxxxxxxxx">
      </div>

      <div class="form-group">
        <div class="form-label" id="typeLabel">
          نوع الوحدة
        </div>

        <div class="unit-types">

          <label class="choice">
            <input
              type="radio"
              name="unitType"
              value="Residential"
              required>
            <span class="ar-only">سكني</span>
            <span class="en-only" hidden>Residential</span>
          </label>

          <label class="choice">
            <input
              type="radio"
              name="unitType"
              value="Commercial">
            <span class="ar-only">تجاري</span>
            <span class="en-only" hidden>Commercial</span>
          </label>

          <label class="choice">
            <input
              type="radio"
              name="unitType"
              value="Administrative">
            <span class="ar-only">إداري</span>
            <span class="en-only" hidden>Administrative</span>
          </label>

        </div>
      </div>

      <div class="form-group">
        <label class="form-label" id="areaLabel" for="area">
          مساحة الوحدة
        </label>

        <select id="area" name="area" required>
          <option value="">اختر مساحة الوحدة</option>
          <option value="50 to 100 m²">من 50 إلى 100 متر</option>
          <option value="100 to 200 m²">من 100 إلى 200 متر</option>
          <option value="200 to 300 m²">من 200 إلى 300 متر</option>
          <option value="Other">أخرى</option>
        </select>

        <input
          id="areaOther"
          name="areaOther"
          class="other-input"
          type="text"
          placeholder="اكتب مساحة الوحدة">
      </div>

      <div class="form-group">
        <label class="form-label" id="descriptionLabel" for="description">
          وصف الوحدة
        </label>

        <select id="description" name="description" required>
          <option value="">اختر وصف الوحدة</option>
          <option value="Studio">ستوديو</option>
          <option value="Apartment">شقة</option>
          <option value="Villa">فيلا</option>
          <option value="Duplex">دوبلكس</option>
          <option value="Office">مكتب</option>
          <option value="Shop">محل</option>
          <option value="Other">أخرى</option>
        </select>

        <input
          id="descriptionOther"
          name="descriptionOther"
          class="other-input"
          type="text"
          placeholder="اكتب وصف الوحدة">
      </div>

      <div class="form-group">
        <label class="form-label" id="locationLabel" for="location">
          الموقع
        </label>

        <input
          id="location"
          name="location"
          type="text"
          required
          placeholder="اكتب العنوان">
      </div>

      <div class="form-group">
        <label class="form-label" id="conditionLabel" for="condition">
          حالة الوحدة
        </label>

        <select id="condition" name="condition" required>
          <option value="Finished">تشطيب كامل</option>
          <option value="Semi-finished">نصف تشطيب</option>
          <option value="Red brick">على الطوب الأحمر</option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label" id="timeLabel" for="contactTime">
          أنسب وقت للتواصل
        </label>

        <input
          id="contactTime"
          name="contactTime"
          type="text"
          placeholder="مثال: من 6 إلى 8 مساءً">
      </div>

      <div class="buttons">

        <button
          id="whatsappButton"
          class="send-button"
          type="button">
          إرسال عبر واتساب
        </button>

        <button
          id="emailButton"
          class="send-button email"
          type="button">
          إرسال عبر البريد
        </button>

      </div>

      <div id="status"></div>

    </form>

    <div class="note" id="note">
      بالضغط على أحد الأزرار سيتم فتح واتساب أو تطبيق البريد بالبيانات المدخلة.
    </div>

  </main>
</div>

<script>
const translations = {
  ar: {
    eyebrow: "بيانات الوحدة",
    title: "فورم معلومات الوحدة",
    intro: "من فضلك املأ البيانات التالية وسنتواصل معك في أقرب وقت ممكن.",

    name: "الاسم بالكامل",
    namePlaceholder: "اكتب الاسم بالكامل",

    phone: "رقم الهاتف",
    phonePlaceholder: "01xxxxxxxxx",

    type: "نوع الوحدة",

    area: "مساحة الوحدة",
    areaPlaceholder: "اختر مساحة الوحدة",
    area50: "من 50 إلى 100 متر",
    area100: "من 100 إلى 200 متر",
    area200: "من 200 إلى 300 متر",
    other: "أخرى",
    areaOther: "اكتب مساحة الوحدة",

    description: "وصف الوحدة",
    descriptionPlaceholder: "اختر وصف الوحدة",
    studio: "ستوديو",
    apartment: "شقة",
    villa: "فيلا",
    duplex: "دوبلكس",
    office: "مكتب",
    shop: "محل",
    descriptionOther: "اكتب وصف الوحدة",

    location: "الموقع",
    locationPlaceholder: "اكتب العنوان",

    condition: "حالة الوحدة",
    finished: "تشطيب كامل",
    semiFinished: "نصف تشطيب",
    redBrick: "على الطوب الأحمر",

    time: "أنسب وقت للتواصل",
    timePlaceholder: "مثال: من 6 إلى 8 مساءً",

    whatsapp: "إرسال عبر واتساب",
    email: "إرسال عبر البريد",

    note: "بالضغط على أحد الأزرار سيتم فتح واتساب أو تطبيق البريد بالبيانات المدخلة.",

    required: "من فضلك أكمل البيانات المطلوبة أولًا."
  },

  en: {
    eyebrow: "UNIT DETAILS",
    title: "Unit Information Form",
    intro: "Please fill in the details below and we will contact you as soon as possible.",

    name: "Full name",
    namePlaceholder: "Enter your full name",

    phone: "Phone number",
    phonePlaceholder: "01xxxxxxxxx",

    type: "Unit type",

    area: "Unit area",
    areaPlaceholder: "Select unit area",
    area50: "50 to 100 m²",
    area100: "100 to 200 m²",
    area200: "200 to 300 m²",
    other: "Other",
    areaOther: "Enter unit area",

    description: "Unit description",
    descriptionPlaceholder: "Select unit description",
    studio: "Studio",
    apartment: "Apartment",
    villa: "Villa",
    duplex: "Duplex",
    office: "Office",
    shop: "Shop",
    descriptionOther: "Enter unit description",

    location: "Location",
    locationPlaceholder: "Enter the address",

    condition: "Unit condition",
    finished: "Finished",
    semiFinished: "Semi-finished",
    redBrick: "Red brick",

    time: "Preferred contact time",
    timePlaceholder: "Example: 6 to 8 PM",

    whatsapp: "Send via WhatsApp",
    email: "Send via Email",

    note: "Click a button to open WhatsApp or your email app with the entered details.",

    required: "Please complete the required fields first."
  }
};

let currentLanguage = "ar";

const $ = (id) => document.getElementById(id);

function setLanguage(language) {
  currentLanguage = language;

  const t = translations[language];

  document.documentElement.lang = language;
  document.documentElement.dir = language === "ar" ? "rtl" : "ltr";

  $("eyebrow").textContent = t.eyebrow;
  $("title").textContent = t.title;
  $("intro").textContent = t.intro;

  $("nameLabel").textContent = t.name;
  $("name").placeholder = t.namePlaceholder;

  $("phoneLabel").textContent = t.phone;
  $("phone").placeholder = t.phonePlaceholder;

  $("typeLabel").textContent = t.type;

  $("areaLabel").textContent = t.area;
  $("areaOther").placeholder = t.areaOther;

  const areaOptions = $("area").options;
  areaOptions[0].textContent = t.areaPlaceholder;
  areaOptions[1].textContent = t.area50;
  areaOptions[2].textContent = t.area100;
  areaOptions[3].textContent = t.area200;
  areaOptions[4].textContent = t.other;

  $("descriptionLabel").textContent = t.description;
  $("descriptionOther").placeholder = t.descriptionOther;

  const descriptionOptions = $("description").options;
  descriptionOptions[0].textContent = t.descriptionPlaceholder;
  descriptionOptions[1].textContent = t.studio;
  descriptionOptions[2].textContent = t.apartment;
  descriptionOptions[3].textContent = t.villa;
  descriptionOptions[4].textContent = t.duplex;
  descriptionOptions[5].textContent = t.office;
  descriptionOptions[6].textContent = t.shop;
  descriptionOptions[7].textContent = t.other;

  $("locationLabel").textContent = t.location;
  $("location").placeholder = t.locationPlaceholder;

  $("conditionLabel").textContent = t.condition;

  const conditionOptions = $("condition").options;
  conditionOptions[0].textContent = t.finished;
  conditionOptions[1].textContent = t.semiFinished;
  conditionOptions[2].textContent = t.redBrick;

  $("timeLabel").textContent = t.time;
  $("contactTime").placeholder = t.timePlaceholder;

  $("whatsappButton").textContent = t.whatsapp;
  $("emailButton").textContent = t.email;
  $("note").textContent = t.note;

  document.querySelectorAll(".ar-only").forEach((element) => {
    element.hidden = language !== "ar";
  });

  document.querySelectorAll(".en-only").forEach((element) => {
    element.hidden = language !== "en";
  });

  $("arButton").classList.toggle("active", language === "ar");
  $("enButton").classList.toggle("active", language === "en");

  $("status").textContent = "";
}

function updateChoiceStyle() {
  document.querySelectorAll(".choice").forEach((choice) => {
    const radio = choice.querySelector("input");

    choice.classList.toggle("selected", radio.checked);
  });
}

function updateOtherField(selectId, inputId) {
  const select = $(selectId);
  const input = $(inputId);

  const isOther = select.value === "Other";

  input.classList.toggle("visible", isOther);
  input.required = isOther;

  if (!isOther) {
    input.value = "";
  }
}

function getValue(selectId, otherId) {
  const select = $(selectId);
  const other = $(otherId);

  if (select.value === "Other") {
    return other.value.trim();
  }

  return select.value;
}

function formIsValid() {
  const form = $("unitForm");
  const status = $("status");

  if (!form.checkValidity()) {
    status.textContent = translations[currentLanguage].required;
    form.reportValidity();
    return false;
  }

  status.textContent = "";
  return true;
}

function buildMessage() {
  const formData = new FormData($("unitForm"));

  const selectedType =
    document.querySelector('input[name="unitType"]:checked');

  return [
    "ZAC Architecture Studio",
    "",
    "Name / الاسم: " + formData.get("name"),
    "Phone / الهاتف: " + formData.get("phone"),
    "Unit type / نوع الوحدة: " +
      (selectedType ? selectedType.value : "-"),
    "Unit area / مساحة الوحدة: " +
      getValue("area", "areaOther"),
    "Unit description / وصف الوحدة: " +
      getValue("description", "descriptionOther"),
    "Location / الموقع: " + formData.get("location"),
    "Condition / حالة الوحدة: " +
      formData.get("condition"),
    "Preferred contact time / أنسب وقت للتواصل: " +
      (formData.get("contactTime") || "-")
  ].join("
");
}

function sendWhatsApp() {
  if (!formIsValid()) {
    return;
  }

  const message = buildMessage();

  const whatsappUrl =
    "https://wa.me/201555364449?text=" +
    encodeURIComponent(message);

  window.location.href = whatsappUrl;
}

function sendEmail() {
  if (!formIsValid()) {
    return;
  }

  const emailUrl =
    "mailto:zacarchitecturestudio@gmail.com" +
    "?subject=" +
    encodeURIComponent("ZAC Unit Information Form") +
    "&body=" +
    encodeURIComponent(buildMessage());

  window.location.href = emailUrl;
}

$("arButton").addEventListener("click", () => {
  setLanguage("ar");
});

$("enButton").addEventListener("click", () => {
  setLanguage("en");
});

$("area").addEventListener("change", () => {
  updateOtherField("area", "areaOther");
});

$("description").addEventListener("change", () => {
  updateOtherField("description", "descriptionOther");
});

document.querySelectorAll('input[name="unitType"]').forEach((radio) => {
  radio.addEventListener("change", updateChoiceStyle);
});

setLanguage("ar");
updateOtherField("area", "areaOther");
updateOtherField("description", "descriptionOther");
updateChoiceStyle();
</script>

</body>
</html>
